<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Toolset - Settings</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <h1>Settings</h1>
        <div class="setting">
            <label for="distance-unit-setting">Distance unit:</label>
            <select name="distance-unit-setting" id="distance-unit-setting">
                <option value="metric">Metric (km)</option>
                <option value="imperial">Imperial (mi)</option>
            </select>
        </div>
        <script type="module" src="script.js"></script>
    </body>
</html>
