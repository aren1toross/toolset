<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Toolset - Distance</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <h1>Distance</h1>
        <section>
            <h2>Options</h2>
            <div class="input-container">
                <label for="new-location-ignore-radius">Radius from previous point in which to ignore a new position:</label>
                <input name="new-location-ignore-radius" id="new-location-ignore-radius" type="range" value="0" min="0" max="500" step="10"/>
                <output name="new-location-ignore-radius-out" id="new-location-ignore-radius-out"></output>
            </div>
            <button type="button" id="start-tacking-distance">Start</button>
            <button type="button" id="save-tracking-data">Save</button>

            <p><b>Started from:</b> <span id="start-location"></span></p>
            <p><b>Currently at:</b> <span id="current-location"></span></p>
            <p><b>Distance from start:</b> <span id="distance-from-start"></span></p>
            <details>
                <summary><b>Previous points:</b></summary>
                <button type="button" id="copy-previous-points">Copy points</button>
                <ul id="previous-points"></ul>
            </details>
        </section>
        <hr>
        <section>
            <h2>Saved</h2>
        </section>

        <script type="module" src="script.js"></script>
    </body>
</html>
