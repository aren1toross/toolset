<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Toolset - Speedometer</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <h1>Speedometer</h1>
        <button type="button" id="start-speed-tracking">Start</button>
        <p><b>Current speed:</b> <span id="current-speed"></span></p>
        <p><b>Max speed:</b> <span id="max-speed"></span></p>
        <p><b>Average speed:</b> <span id="average-speed"></span></p>

        <script type="module" src="script.js"></script>
    </body>
</html>
